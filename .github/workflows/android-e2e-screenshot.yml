name: Android UI Screenshot

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/android-e2e-screenshot.yml
      - app/**
      - build.gradle
      - settings.gradle
      - gradle/**
      - gradle.properties

permissions:
  contents: write

jobs:
  screenshot-welcome:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Record welcome screenshot without emulator
        run: |
          chmod +x ./gradlew
          rm -rf app/src/test/snapshots
          ./gradlew :app:recordPaparazziDebug --tests com.example.newsapp.WelcomeScreenshotTest

      - name: Copy screenshot to repository folder
        run: |
          mkdir -p screenshots/android
          snapshot="$(find app/src/test/snapshots -type f -name '*.png' -print -quit)"
          if [ -z "$snapshot" ]; then
            echo "No Paparazzi PNG was generated."
            exit 1
          fi
          cp "$snapshot" screenshots/android/welcome.png
          test -s screenshots/android/welcome.png
          file screenshots/android/welcome.png
          echo "Generated screenshot: $snapshot"

      - name: Commit screenshot to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add screenshots/android/welcome.png
          if git diff --cached --quiet; then
            echo "Screenshot unchanged; nothing to commit."
            exit 0
          fi
          git commit -m "chore: update Android welcome screenshot"
          git push
